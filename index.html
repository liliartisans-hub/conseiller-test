<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://bcntaxpxhyyhgrlhekmn.supabase.co; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>Conseiller cave — test</title>
<!-- Page de test privée. AUCUNE clé ici : seulement l'adresse de la fonction ; le code d'accès est saisi par la personne qui teste. -->
<style>
  :root { --fond: #f7f4ef; --carte: #fff; --texte: #2a2420; --doux: #6f645b; --accent: #7b2d26; --bord: #e2dbd2; --bandeau: #2a2420; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 17px/1.5 system-ui, -apple-system, sans-serif; background: var(--fond); color: var(--texte);
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--bord); display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  button { font: inherit; cursor: pointer; }
  .discret { background: none; border: 1px solid var(--bord); border-radius: 8px; padding: 6px 10px; font-size: 14px; color: var(--texte); }
  #acces { padding: 12px 16px; border-bottom: 1px solid var(--bord); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #acces label { font-size: 15px; }
  #code { width: 8.5em; letter-spacing: .2em; }
  #fil { flex: 1; overflow-y: auto; padding: 12px 16px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { margin: 10px 0; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .client { background: var(--accent); color: #fff; margin-left: 12%; }
  .conseiller { background: var(--carte); border: 1px solid var(--bord); margin-right: 6%; }
  .conseiller a { color: var(--accent); }
  .erreur { background: #fff3f1; border: 1px solid #e3b4ad; color: #7b2d26; }
  form#f { display: flex; gap: 8px; padding: 10px 16px; max-width: 760px; width: 100%; margin: 0 auto; }
  input { padding: 10px; border: 1px solid var(--bord); border-radius: 8px; font: inherit; font-size: 16px; min-width: 0; }
  #m { flex: 1; }
  .envoyer { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; }
  .envoyer:disabled { opacity: .5; }
  footer { background: var(--bandeau); color: #fff; text-align: center; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); font-size: 14px; }
</style>
</head>
<body>
<header><h1>Conseiller cave — page de test</h1><button id="raz" class="discret" type="button">Nouvelle conversation</button></header>
<div id="acces">
  <label for="code">Code d'accès</label>
  <input id="code" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="······">
</div>
<div id="fil" aria-live="polite"></div>
<form id="f"><input id="m" autocomplete="off" placeholder="Votre question…" maxlength="1000" required><button class="envoyer" id="envoyer">Envoyer</button></form>
<footer>L'abus d'alcool est dangereux pour la santé, à consommer avec modération.</footer>
<script>
  const ADRESSE = 'https://bcntaxpxhyyhgrlhekmn.supabase.co/functions/v1/conseiller';
  const fil = document.getElementById('fil');
  const champCode = document.getElementById('code');
  const bouton = document.getElementById('envoyer');
  const nouvelleSession = () => crypto.randomUUID();
  let session = nouvelleSession();
  // Le code reste dans l'onglet (sessionStorage), jamais ailleurs ; la page marche aussi sans.
  try { champCode.value = sessionStorage.getItem('code') || ''; } catch (e) {}
  champCode.addEventListener('input', () => { try { sessionStorage.setItem('code', champCode.value.trim()); } catch (e) {} });

  const echapper = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // v5 : « [Nom — prix](adresse) » (écrit par le code) devient un lien cliquable ; aucune adresse affichée.
  const ADRESSE_BOUTIQUE = 'https:\\/\\/maisondesire\\.com\\/[\\w\\/-]*';
  const lier = s => echapper(s)
    .replace(new RegExp('\\[([^\\]]+)\\]\\((' + ADRESSE_BOUTIQUE + ')\\)', 'g'), (m, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`)
    .replace(new RegExp('(?<!href=")' + ADRESSE_BOUTIQUE + '(?![\\w\\/-])', 'g'), u => `<a href="${u}" target="_blank" rel="noopener noreferrer">voir la bouteille</a>`);
  function ajouter(classe, html) {
    const d = document.createElement('div'); d.className = 'msg ' + classe; d.innerHTML = html; fil.appendChild(d);
    fil.scrollTop = fil.scrollHeight; return d;
  }
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const champ = document.getElementById('m');
    const message = champ.value.trim(); if (!message) return;
    const code = champCode.value.trim();
    if (!code) { ajouter('erreur', "Saisissez d'abord le code d'accès."); champCode.focus(); return; }
    champ.value = '';
    ajouter('client', echapper(message));
    const attente = ajouter('conseiller', '…');
    bouton.disabled = true;
    try {
      const r = await fetch(ADRESSE, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code, session, message }) });
      const s = await r.json().catch(() => ({}));
      if (!r.ok) { attente.className = 'msg erreur'; attente.textContent = s.erreur || 'Le conseiller ne répond pas. Réessayez dans un instant.'; return; }
      attente.innerHTML = lier(s.texte_affiche);
    } catch (err) {
      attente.className = 'msg erreur'; attente.textContent = 'Connexion impossible. Vérifiez votre réseau et réessayez.';
    } finally { bouton.disabled = false; }
  });
  document.getElementById('raz').addEventListener('click', () => { session = nouvelleSession(); fil.innerHTML = ''; });
</script>
</body>
</html>
